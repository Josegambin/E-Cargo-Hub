services:

  postgres:
    image: postgis/postgis:17-3.5
    container_name: simulador-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simulador_logistico
      POSTGRES_USER: simulador
      POSTGRES_PASSWORD: simulador
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulador -d simulador_logistico"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.1
    container_name: simulador-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      
      # Configuramos dos puertos: 9092 para localhost (tu backend) y 9094 para la red interna de Docker (la UI)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://simulador-kafka:9094
      
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      
      # Corregido para apuntar al container_name real
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@simulador-kafka:9093
      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: simulador-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: simulador
      # Corregido: Conecta de forma interna al container_name usando el puerto secundario dedicado
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: simulador-kafka:9094
  
  simulador-redis:
    image: redis:7 # Cambiado de 7-alpine a 7 (Debian) para evitar problemas de permisos
    container_name: simulador-redis
    restart: unless-stopped # Añadido para que inicie siempre con el sistema
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data


volumes:
  postgres_data:
  kafka_data:
  redis-data:
