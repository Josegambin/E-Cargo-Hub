spring:
  application:
    name: E-Cargo-Hub

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/simulador_logistico}
    username: ${DATABASE_USER:simulador}
    password: ${DATABASE_PASSWORD:simulador}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: Europe/Madrid

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/e-cargo-hub}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/e-cargo-hub/protocol/openid-connect/certs}

# ==========================================
# CORS (namespace propio, NO dentro de spring)
# ==========================================
app:
  security:
    control-token: ${ECARGO_CONTROL_API_TOKEN:}
    keycloak-client-id: ${KEYCLOAK_CLIENT_ID:ecargo-dashboard}
  rate-limit:
    max-requests: ${ECARGO_API_RATE_LIMIT_MAX_REQUESTS:100}
    window-seconds: ${ECARGO_API_RATE_LIMIT_WINDOW_SECONDS:60}
  vhal:
    enabled: ${ECARGO_VHAL_ENABLED:false}
    adb-path: ${ECARGO_VHAL_ADB:adb}
    serial: ${ECARGO_VHAL_SERIAL:emulator-5554}
    timeout-seconds: ${ECARGO_VHAL_TIMEOUT_SECONDS:5}
  mobile-app-url: ${ECARGO_MOBILE_APP_URL:http://localhost:4200/vehicle-display}
  cors:
    allowed-origins: ${ECARGO_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8081,http://127.0.0.1:8081,http://localhost,http://127.0.0.1}

# ==========================================
# GraphHopper
# ==========================================
graphhopper:
  api:
    key: ${GRAPHHOPPER_API_KEY:}
    url: https://graphhopper.com/api/1

# ==========================================
# Servidor
# ==========================================
server:
  port: 8081

# ==========================================
# Actuator + Health checks
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - mappings
  endpoint:
    health:
      show-details: when-authorized
      roles:
        - ADMIN
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true

# ==========================================
# Info del proyecto (aparece en /actuator/info)
# ==========================================
info:
  app:
    name: E-Cargo Hub
    description: Backend de simulación logística con Kafka, WebSocket y PostGIS
    version: 1.0.0-SNAPSHOT
    java-version: 21

# ==========================================
# Logs (niveles por paquete)
# ==========================================
logging:
  level:
    root: INFO
    com.ecargohub.backend: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
    org.springframework.web: INFO

# ==========================================
# Swagger / OpenAPI (para el Sprint B)
# ==========================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: true