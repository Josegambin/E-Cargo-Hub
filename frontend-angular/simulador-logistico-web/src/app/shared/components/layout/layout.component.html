<div class="h-screen flex flex-col bg-gray-50 dark:bg-gray-900">

    <!-- 🏠 TOOLBAR SUPERIOR -->
    <header class="h-16 bg-sky-600 dark:bg-sky-800 text-white flex items-center px-4 shadow-lg z-20">

        <!-- Logo + título -->
        <div class="flex items-center gap-2">
            <span class="text-2xl">🚚</span>
            <div class="flex flex-col leading-tight">
                <span class="font-bold text-lg">{{ t('app.title') }}</span>
                <span class="text-xs opacity-80">{{ t('app.subtitle') }}</span>
            </div>
        </div>

        <div class="flex-1"></div>

        <!-- 🔌 Estado conexión -->
        <div class="flex items-center gap-2 px-3 py-1 rounded-full mr-2 transition-colors"
             [ngClass]="connected()
                ? 'bg-green-500/20 text-green-100'
                : 'bg-red-500/20 text-red-100'">
            <span class="w-2 h-2 rounded-full"
                  [ngClass]="connected() ? 'bg-green-400 animate-pulse' : 'bg-red-400'"></span>
            <span class="text-sm font-medium hidden md:inline">
                {{ connected() ? t('status.connected') : t('status.disconnected') }}
            </span>
        </div>

        <!-- 🌐 Idioma -->
        <button mat-icon-button [matMenuTriggerFor]="langMenu" [matTooltip]="t('menu.language')"
                class="text-white">
            <mat-icon>language</mat-icon>
        </button>
        <mat-menu #langMenu="matMenu">
            <button mat-menu-item (click)="setLanguage('es')">
                <span class="mr-2">🇪🇸</span> Español
            </button>
            <button mat-menu-item (click)="setLanguage('en')">
                <span class="mr-2">🇬🇧</span> English
            </button>
        </mat-menu>

        <!-- 🌓 Tema -->
        <button mat-icon-button (click)="toggleTheme()"
                [matTooltip]="isDark() ? t('theme.light') : t('theme.dark')"
                class="text-white">
            <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
    </header>

    <!-- 🔽 CONTENIDO: SIDEBAR + MAIN -->
    <div class="flex flex-1 overflow-hidden">

        <!-- 📚 SIDEBAR -->
        <aside class="w-56 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col">
            <nav class="flex-1 py-4">

                <a routerLink="/dashboard"
                   routerLinkActive="bg-sky-100 dark:bg-sky-900 text-sky-700 dark:text-sky-300"
                   [routerLinkActiveOptions]="{ exact: false }"
                   class="flex items-center gap-3 px-4 py-3 mx-2 rounded-lg text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors cursor-pointer">
                    <mat-icon>dashboard</mat-icon>
                    <span class="font-medium">{{ t('nav.dashboard') }}</span>
                </a>

                <a routerLink="/vehicles"
                   routerLinkActive="bg-sky-100 dark:bg-sky-900 text-sky-700 dark:text-sky-300"
                   class="flex items-center gap-3 px-4 py-3 mx-2 rounded-lg text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors cursor-pointer">
                    <mat-icon>local_shipping</mat-icon>
                    <span class="font-medium">{{ t('nav.vehicles') }}</span>
                </a>

                <a routerLink="/commands"
                   routerLinkActive="bg-sky-100 dark:bg-sky-900 text-sky-700 dark:text-sky-300"
                   class="flex items-center gap-3 px-4 py-3 mx-2 rounded-lg text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors cursor-pointer">
                    <mat-icon>play_circle</mat-icon>
                    <span class="font-medium">{{ t('nav.commands') }}</span>
                </a>

                <a routerLink="/telemetry"
                   routerLinkActive="bg-sky-100 dark:bg-sky-900 text-sky-700 dark:text-sky-300"
                   class="flex items-center gap-3 px-4 py-3 mx-2 rounded-lg text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors cursor-pointer">
                    <mat-icon>history</mat-icon>
                    <span class="font-medium">{{ t('nav.telemetry') }}</span>
                </a>
            </nav>

            <!-- Footer del sidebar -->
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 text-xs text-gray-500 dark:text-gray-400">
                <div>v1.0.0</div>
                <div>© 2026 E-Cargo Hub</div>
            </div>
        </aside>

        <!-- 📄 MAIN CONTENT -->
        <main class="flex-1 overflow-auto p-6">
            <router-outlet />
        </main>
    </div>
</div>
