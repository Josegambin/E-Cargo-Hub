<div class="min-h-screen bg-[#1a1d24] text-slate-100">
    <div class="max-w-[1600px] mx-auto p-4 lg:p-6">

        <!-- 🏠 TOPBAR FLOTANTE -->
        <div class="card px-3 py-2.5 flex items-center gap-3 mb-4 animate-fade-in-up">

            <!-- Logo + Título -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-accent-cyan to-accent-violet
                            flex items-center justify-center text-lg shadow-lg">
                    🚚
                </div>
                <div class="hidden md:flex flex-col leading-tight">
                    <span class="font-display font-bold text-white">E-Cargo Hub</span>
                    <span class="text-xs text-slate-400">Logistics Simulator</span>
                </div>
            </div>

            <!-- Navegación -->
            <div class="flex items-center gap-2 ml-6">
                <a routerLink="/dashboard" routerLinkActive="active"
                   class="topbar-btn" matTooltip="Dashboard">
                    <mat-icon class="text-[20px]">dashboard</mat-icon>
                </a>
                <a routerLink="/vehicles" routerLinkActive="active"
                   class="topbar-btn" matTooltip="Vehículos">
                    <mat-icon class="text-[20px]">local_shipping</mat-icon>
                </a>
                <a routerLink="/commands" routerLinkActive="active"
                   class="topbar-btn" matTooltip="Comandos">
                    <mat-icon class="text-[20px]">play_circle</mat-icon>
                </a>
                <a routerLink="/telemetry" routerLinkActive="active"
                   class="topbar-btn" matTooltip="Histórico">
                    <mat-icon class="text-[20px]">history</mat-icon>
                </a>
                <button class="topbar-btn" matTooltip="Alertas">
                    <mat-icon class="text-[20px]">notifications</mat-icon>
                </button>
                <button class="topbar-btn" matTooltip="Usuarios">
                    <mat-icon class="text-[20px]">people</mat-icon>
                </button>
            </div>

            <div class="flex-1"></div>

            <!-- Estado conexión -->
            <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full
                        bg-accent-green/10 border border-accent-green/20">
                <span class="w-2 h-2 rounded-full bg-accent-green live-dot"></span>
                <span class="text-xs font-semibold text-accent-green">
                    {{ connected() ? 'CONNECTED' : 'DISCONNECTED' }}
                </span>
            </div>

            <!-- Idioma -->
            <button class="topbar-btn" [matMenuTriggerFor]="langMenu" matTooltip="Idioma">
                <mat-icon class="text-[20px]">language</mat-icon>
            </button>
            <mat-menu #langMenu="matMenu">
                <button mat-menu-item (click)="setLanguage('es')">
                    <span class="mr-2">🇪🇸</span> Español
                </button>
                <button mat-menu-item (click)="setLanguage('en')">
                    <span class="mr-2">🇬🇧</span> English
                </button>
            </mat-menu>

            <!-- Tema -->
            <button class="topbar-btn" (click)="toggleTheme()" matTooltip="Tema">
                <mat-icon class="text-[20px]">{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
            </button>

            <!-- Logout -->
            <button class="px-4 py-2 rounded-full bg-accent-cyan text-[#1a1d24] font-semibold text-sm
                           hover:shadow-lg hover:shadow-accent-cyan/30 transition-all">
                Logout
            </button>
        </div>

        <!-- 📄 CONTENIDO -->
        <router-outlet />
    </div>
</div>
